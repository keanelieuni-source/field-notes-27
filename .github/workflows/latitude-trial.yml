name: Daily update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
    - cron: '7 2 15 10 *'
permissions:
  contents: read
concurrency:
  group: latitude-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0 openpyxl==3.1.5
      - run: python -m playwright install --with-deps chromium
      - name: Run safety regression tests
        run: |
          python test_collector.py
          python test_demand.py
      - name: Collect and validate Latitude, OpenRouter and Ramp
        run: python collect_latitude.py
      - name: Rebuild Excel history
        run: python rebuild_workbook.py
      - name: Commit validated data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots.json workbook.b64
          if ! git diff --cached --quiet; then
            git commit -m 'Update data'
            git pull --rebase origin main
            git push
          fi
      - name: Keep collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latitude-collection
          path: collector-output/
          retention-days: 7
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir public
          cp index.html snapshots.json workbook.b64 public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy validated snapshot
        id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep repository active after a quiet period
        run: |
          set -euo pipefail
          age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Days since latest main commit: $age"
          if [ "$age" -ge 40 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Update activity'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
